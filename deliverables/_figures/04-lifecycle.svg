<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="#fbfbf9"/>
  <text x="40" y="42" font-size="22" font-weight="600" fill="#111">04 从本体到应用：建 → 用 → 治</text>
  <text x="40" y="68" font-size="13" fill="#666">不是瀑布：建完要能被查，查完要能被授权；治理会把问题打回建/用</text>

  <rect x="40" y="104" width="270" height="150" rx="12" fill="#fff4ea" stroke="#a8642d"/>
  <text x="62" y="136" font-size="18" font-weight="700" fill="#5e3518">A · 建</text>
  <text x="62" y="164" font-size="13" fill="#5e3518">CQ → 候选 → 公理</text>
  <text x="62" y="186" font-size="13" fill="#5e3518">对齐 / 精化 / 评估</text>
  <text x="62" y="218" font-size="12" fill="#a8642d">谁：本体/数据工程师</text>
  <text x="62" y="238" font-size="12" fill="#a8642d">产出：可被消费的本体</text>

  <line x1="315" y1="178" x2="365" y2="178" stroke="#666" stroke-width="2" marker-end="url(#a04)"/>

  <rect x="370" y="104" width="270" height="150" rx="12" fill="#eef5ff" stroke="#3b6ea5"/>
  <text x="392" y="136" font-size="18" font-weight="700" fill="#1d3f5e">B · 用</text>
  <text x="392" y="164" font-size="13" fill="#1d3f5e">KG 构建 / Text2SPARQL</text>
  <text x="392" y="186" font-size="13" fill="#1d3f5e">virtual KG / MCP / 工具</text>
  <text x="392" y="218" font-size="12" fill="#3b6ea5">谁：应用/agent 工程师</text>
  <text x="392" y="238" font-size="12" fill="#3b6ea5">产出：可执行查询</text>

  <line x1="645" y1="178" x2="695" y2="178" stroke="#666" stroke-width="2" marker-end="url(#a04)"/>

  <rect x="700" y="104" width="260" height="150" rx="12" fill="#fdeeee" stroke="#a33b3b"/>
  <text x="722" y="136" font-size="18" font-weight="700" fill="#5e2020">C · 治</text>
  <text x="722" y="164" font-size="13" fill="#5e2020">权限 / 来源 / 时效</text>
  <text x="722" y="186" font-size="13" fill="#5e2020">审计 / 输出校验</text>
  <text x="722" y="218" font-size="12" fill="#a33b3b">谁：治理/安全/合规</text>
  <text x="722" y="238" font-size="12" fill="#a33b3b">产出：授权与审计</text>

  <path d="M 830 260 C 830 310, 175 310, 175 260" fill="none" stroke="#999" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a04)"/>
  <text x="420" y="326" font-size="12" fill="#777">治理问题打回建/用：权限不够、来源缺失、时效过期</text>

  <rect x="40" y="356" width="920" height="110" rx="10" fill="#f7f7f4" stroke="#bbb"/>
  <text x="60" y="382" font-size="13" font-weight="700">每段的第一个问题</text>
  <text x="60" y="408" font-size="12" fill="#444">建：CQ 能不能被消费？每个约束有没有负例？ ｜ 用：schema 能不能支撑这个问题？查询空结果是覆盖不足还是排错？</text>
  <text x="60" y="430" font-size="12" fill="#444">治：谁有权看/写？证据够不够授权？失败会不会沿图/工具/记忆传播？</text>
  <text x="60" y="452" font-size="12" fill="#777">04 只给“问题 + 最小验证 + 不能证明什么”；外部厂商/论文只作信号，不是 E。</text>
</svg>
