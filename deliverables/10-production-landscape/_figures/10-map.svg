<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-labelledby="title desc">
  <title id="title">05 一页读懂：本体落地到哪了</title>
  <desc id="desc">问题链五步横向排列：谁在生产里跑、坑在哪、两国证据为何不对称、钱花在哪、今天怎么做。底部是证据天花板：能回答谁在跑/什么形态/公开规模/坑长什么样；不能回答哪家最好/ROI/成功率/跨行业复制。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1180" height="600" fill="url(#bg)"/>
  <text x="40" y="42" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#0f172a">05 一页读懂：本体落地到哪了</text>
  <text x="40" y="68" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">问题链五步：谁在跑 → 坑在哪 → 两国为何不同 → 钱花在哪 → 今天怎么做。每步只留一个结论和一个数。</text>

  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <rect x="40" y="100" width="200" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <path d="M52,100 h176 a12,12 0 0 1 12,12 v32 h-200 v-32 a12,12 0 0 1 12,-12 z" fill="#dbeafe"/>
    <circle cx="62" cy="122" r="13" fill="#2563eb"/>
    <text x="62" y="127" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="84" y="127" font-size="13" font-weight="700" fill="#1e3a8a">谁在生产里跑</text>
    <g font-size="11.5" fill="#1e293b">
      <text x="56" y="172">5 条 A 类生产证据</text>
      <text x="56" y="196">通用企业本体：0 条</text>
      <text x="56" y="220">领域专用：Netflix 1</text>
      <text x="56" y="244">本体试点：中泰 1</text>
      <text x="56" y="268">BI 语义层：2 条</text>
    </g>
    <rect x="56" y="326" width="168" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="140" y="343" font-size="9.5" fill="#475569" text-anchor="middle">含 2 条 probation</text>
  </g>

  <line x1="242" y1="240" x2="262" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <rect x="266" y="100" width="200" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <path d="M278,100 h176 a12,12 0 0 1 12,12 v32 h-200 v-32 a12,12 0 0 1 12,-12 z" fill="#fee2e2"/>
    <circle cx="288" cy="122" r="13" fill="#dc2626"/>
    <text x="288" y="127" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="310" y="127" font-size="13" font-weight="700" fill="#7f1d1d">坑在哪</text>
    <g font-size="11.5" fill="#1e293b">
      <text x="282" y="172">影子实体 / 口径漂移</text>
      <text x="282" y="196">权限特批 / 聚合泄露</text>
      <text x="282" y="220">视图延迟 / 维护爆炸</text>
      <text x="282" y="244">证据不足仍交付 SQL</text>
      <text x="282" y="268">图性能主诉：0 条</text>
    </g>
    <rect x="282" y="326" width="168" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="366" y="343" font-size="9.5" fill="#475569" text-anchor="middle">已核：中泰 + Snowflake</text>
  </g>

  <line x1="468" y1="240" x2="488" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <rect x="492" y="100" width="200" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <path d="M504,100 h176 a12,12 0 0 1 12,12 v32 h-200 v-32 a12,12 0 0 1 12,-12 z" fill="#ede9fe"/>
    <circle cx="514" cy="122" r="13" fill="#7c3aed"/>
    <text x="514" y="127" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="536" y="127" font-size="13" font-weight="700" fill="#4c1d95">两国为何不一样</text>
    <g font-size="11.5" fill="#1e293b">
      <text x="508" y="172">美国：工程博客 + 规模</text>
      <text x="508" y="196">中国：会议/标准 + 采购</text>
      <text x="508" y="220">大厂 2026-06 后</text>
      <text x="508" y="244">具名客户：0</text>
      <text x="508" y="268">证据不对称，不是排序</text>
    </g>
    <rect x="508" y="326" width="168" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="592" y="343" font-size="9.5" fill="#475569" text-anchor="middle">已核 / 成熟度为推测</text>
  </g>

  <line x1="694" y1="240" x2="714" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <rect x="718" y="100" width="200" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <path d="M730,100 h176 a12,12 0 0 1 12,12 v32 h-200 v-32 a12,12 0 0 1 12,-12 z" fill="#fef3c7"/>
    <circle cx="740" cy="122" r="13" fill="#d97706"/>
    <text x="740" y="127" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="762" y="127" font-size="13" font-weight="700" fill="#78350f">钱花在哪</text>
    <g font-size="11.5" fill="#1e293b">
      <text x="734" y="172">重型平台 ≈ £2.0M/年</text>
      <text x="734" y="196">建设 ¥49–276 万</text>
      <text x="734" y="220">维护 ¥178.8 万/年*</text>
      <text x="734" y="244">运行 $37–175/月</text>
      <text x="734" y="268" font-size="10.5" fill="#92400e">*超窗背景，只作锚点</text>
    </g>
    <rect x="734" y="326" width="168" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="818" y="343" font-size="9.5" fill="#475569" text-anchor="middle">无全生命周期账本</text>
  </g>

  <line x1="920" y1="240" x2="940" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <rect x="944" y="100" width="200" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <path d="M956,100 h176 a12,12 0 0 1 12,12 v32 h-200 v-32 a12,12 0 0 1 12,-12 z" fill="#d1fae5"/>
    <circle cx="966" cy="122" r="13" fill="#059669"/>
    <text x="966" y="127" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="988" y="127" font-size="13" font-weight="700" fill="#064e3b">今天怎么做</text>
    <g font-size="11.5" fill="#1e293b">
      <text x="960" y="172">先列已有底座</text>
      <text x="960" y="196">只做一个口径域</text>
      <text x="960" y="220">预算给养，不给建</text>
      <text x="960" y="244">90 天只看四个数</text>
      <text x="960" y="268">两项达标再扩</text>
    </g>
    <rect x="960" y="326" width="168" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="1044" y="343" font-size="9.5" fill="#475569" text-anchor="middle">见 07 决策 / 08 边界</text>
  </g>

  <text x="40" y="418" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0f172a">证据天花板：读完这份能答什么、不能答什么</text>

  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <rect x="40" y="432" width="540" height="104" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="58" y="456" font-size="12" font-weight="700" fill="#166534">能回答</text>
    <text x="58" y="478" font-size="11" fill="#14532d">谁在跑 · 什么形态 · 公开规模 · 坑长什么样</text>
    <text x="58" y="500" font-size="9.5" fill="#166534">5 条 A 类都披露了规模与失败/限制</text>
    <text x="58" y="518" font-size="9.5" fill="#166534">（成本与独立印证仍缺，见 06 台账）</text>

    <rect x="600" y="432" width="540" height="104" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="618" y="456" font-size="12" font-weight="700" fill="#991b1b">不能回答</text>
    <text x="618" y="478" font-size="11" fill="#7f1d1d">哪家最好 · ROI 多少 · 成功率 · 跨行业复制</text>
    <text x="618" y="500" font-size="9.5" fill="#991b1b">没有一条同时披露规模 + 成本 + 失败 + 独立印证</text>
    <text x="618" y="518" font-size="9.5" fill="#991b1b">→ 没有 A+ 案例；本份不给排名、不给 ROI</text>
  </g>

  <text x="40" y="570" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" fill="#334155">数字均为公开证据原值；图为索引，判断与出处见正文和 90 来源。</text>
</svg>
