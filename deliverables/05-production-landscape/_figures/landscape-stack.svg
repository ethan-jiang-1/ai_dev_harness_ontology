<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">本体落地的四层结构：底座可选可并存，语义层统一</title>
  <desc id="desc">四层结构自下而上：数据/治理层供源，底座/载体层承载，语义层统一，应用层消费。底座层并列五种常见载体（数仓语义层、本体平台、图数据库、数据库内嵌、Wiki/OKF），可单选也可并存。语义层负责概念、指标、同义词、口径、权限、版本、证据。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="sem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="okf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1180" height="640" fill="url(#bg)"/>
  <text x="40" y="42" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#0f172a">本体落地的四层结构：底座可选可并存，语义层统一</text>
  <text x="40" y="68" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">底座不是单选题：五种载体可单选、可叠加；语义层负责统一，数据/治理层供源。</text>

  <!-- ============ grid: labels x=40..200, blocks x=220..960, panels x=990..1140 ============ -->

  <!-- layer labels, vertically centered on their blocks -->
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="end">
    <text x="196" y="124" font-size="14" font-weight="700" fill="#1e3a8a">应用层</text>
    <text x="196" y="146" font-size="11" fill="#334155">谁在消费</text>

    <text x="196" y="228" font-size="14" font-weight="700" fill="#166534">语义层</text>
    <text x="196" y="250" font-size="11" fill="#334155">机器执行什么</text>

    <text x="196" y="382" font-size="14" font-weight="700" fill="#92400e">底座/载体层</text>
    <text x="196" y="404" font-size="11" fill="#334155">本体长在哪</text>
    <text x="196" y="422" font-size="11" fill="#92400e">可单选可叠加</text>

    <text x="196" y="568" font-size="14" font-weight="700" fill="#6b21a8">数据/治理层</text>
    <text x="196" y="590" font-size="11" fill="#334155">语义从哪来</text>
  </g>

  <!-- application layer: y 90..170 -->
  <rect x="220" y="90" width="740" height="80" rx="12" fill="url(#app)" stroke="#60a5fa" filter="url(#shadow)"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle">
    <text x="312" y="122" font-weight="700">问数 / BI</text>
    <text x="312" y="142" font-size="11">同一指标，同一口径</text>
    <text x="497" y="122" font-weight="700">Agent / 工具调用</text>
    <text x="497" y="142" font-size="11">先查语义，再执行</text>
    <text x="682" y="122" font-weight="700">风控 / 审批</text>
    <text x="682" y="142" font-size="11">权限即计算</text>
    <text x="867" y="122" font-weight="700">运维 / 客服 / 研发</text>
    <text x="867" y="142" font-size="11">跨系统同一对象</text>
  </g>

  <!-- semantic layer: y 190..290 -->
  <rect x="220" y="190" width="740" height="100" rx="12" fill="url(#sem)" stroke="#34d399" filter="url(#shadow)"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="590" y="216" font-size="13" font-weight="700" fill="#065f46">本体 / 指标 / 同义词 / 口径 / 权限 / 版本 / 证据</text>
    <g font-size="11" fill="#065f46">
      <rect x="240" y="228" width="168" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="324" y="247" font-weight="700">概念/关系</text><text x="324" y="264">对象、属性、约束</text>

      <rect x="420" y="228" width="168" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="504" y="247" font-weight="700">指标五要素</text><text x="504" y="264">名称/口径/单位/来源</text>

      <rect x="600" y="228" width="168" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="684" y="247" font-weight="700">同义词/问法</text><text x="684" y="264">7,000+ 不是小数</text>

      <rect x="780" y="228" width="160" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="860" y="247" font-weight="700">权限/证据/版本</text><text x="860" y="264">行列/属性级 + 可退役</text>
    </g>
  </g>

  <!-- platform layer: y 320..470, five side-by-side carriers -->
  <rect x="220" y="320" width="740" height="150" rx="12" fill="url(#plat)" stroke="#f59e0b" filter="url(#shadow)"/>
  <text x="590" y="343" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#92400e" text-anchor="middle">五种载体：可单选，也可叠加（如数仓语义层管口径 + Wiki/OKF 管概念文档）</text>

  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">
    <rect x="234" y="356" width="132" height="100" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="300" y="376" font-size="12" font-weight="700">数仓语义层</text>
    <text x="300" y="396">Snowflake</text>
    <text x="300" y="412">dbt / Sigma</text>
    <text x="300" y="434" fill="#92400e">公开证据多</text>

    <rect x="378" y="356" width="132" height="100" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="444" y="376" font-size="12" font-weight="700">本体平台</text>
    <text x="444" y="396">Palantir / Stardog</text>
    <text x="444" y="412">Ontotext</text>
    <text x="444" y="434" fill="#92400e">重型、贵、窄</text>

    <rect x="522" y="356" width="132" height="100" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="588" y="376" font-size="12" font-weight="700">图数据库</text>
    <text x="588" y="396">Neo4j</text>
    <text x="588" y="412">蚂蚁 TuGraph</text>
    <text x="588" y="434" fill="#92400e">多跳、关系</text>

    <rect x="666" y="356" width="132" height="100" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="732" y="376" font-size="12" font-weight="700">数据库内嵌</text>
    <text x="732" y="396">阿里 PolarDB</text>
    <text x="732" y="412">Context0</text>
    <text x="732" y="434" fill="#92400e">薄本体</text>

    <rect x="810" y="356" width="132" height="100" rx="8" fill="url(#okf)" stroke="#0284c7"/>
    <text x="876" y="376" font-size="12" font-weight="700">Wiki / OKF</text>
    <text x="876" y="396">Markdown + YAML</text>
    <text x="876" y="412">concept / links</text>
    <text x="876" y="434" fill="#075985">低成本 · LLM 友好</text>
  </g>

  <!-- data layer: y 500..600 -->
  <rect x="220" y="500" width="740" height="100" rx="12" fill="url(#data)" stroke="#c084fc" filter="url(#shadow)"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#581c87" text-anchor="middle">
    <text x="300" y="534" font-weight="700">表 / 字段 / 码值</text>
    <text x="300" y="554" font-size="10">物理事实</text>
    <text x="446" y="534" font-weight="700">指标 / 规则</text>
    <text x="446" y="554" font-size="10">口径</text>
    <text x="592" y="534" font-weight="700">血缘 / 质量</text>
    <text x="592" y="554" font-size="10">可追溯</text>
    <text x="738" y="534" font-weight="700">权限 / 组织</text>
    <text x="738" y="554" font-size="10">行列/属性</text>
    <text x="884" y="534" font-weight="700">文档 / 经验</text>
    <text x="884" y="554" font-size="10">非结构化</text>
  </g>

  <!-- arrows: bottom-up flow, centered on the block column (x=590) -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="590" y1="500" x2="590" y2="474"/>
    <line x1="590" y1="320" x2="590" y2="294"/>
    <line x1="590" y1="190" x2="590" y2="174"/>
  </g>

  <!-- bottom note: OKF is an option, can be long-term -->
  <text x="220" y="620" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" fill="#334155">Wiki/OKF：成本低、LLM 友好；可长期用，也可按需升级到语义层。</text>

  <!-- right panels: y 90..600, both columns bottom-aligned with the data layer -->
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <rect x="990" y="90" width="150" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="1004" y="113" font-size="12" font-weight="700" fill="#0f172a">怎么读这张图</text>
    <text x="1004" y="137" font-size="10" fill="#334155">自下而上四层：</text>
    <text x="1004" y="157" font-size="10" fill="#334155">数据 → 底座 →</text>
    <text x="1004" y="173" font-size="10" fill="#334155">语义 → 应用</text>
    <text x="1004" y="199" font-size="10" fill="#334155">底座可叠加，</text>
    <text x="1004" y="215" font-size="10" fill="#334155">不必单选。</text>
    <text x="1004" y="241" font-size="10" fill="#334155">语义层是落点；</text>
    <text x="1004" y="257" font-size="10" fill="#334155">OWL 本体只是其中一例。</text>
    <text x="1004" y="281" font-size="10" fill="#334155">公开案例只有</text>
    <text x="1004" y="297" font-size="9" fill="#b91c1c">Netflix（领域专用）</text>

    <rect x="990" y="336" width="150" height="124" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="1004" y="359" font-size="12" font-weight="700" fill="#0f172a">美国公开证据</text>
    <text x="1004" y="381" font-size="10" fill="#334155">强在数仓语义层</text>
    <text x="1004" y="399" font-size="10" fill="#64748b">Snowflake / Sigma</text>
    <text x="1004" y="415" font-size="10" fill="#64748b">Netflix（QuipuDB）</text>
    <text x="1004" y="431" font-size="10" fill="#64748b">Palantir（重型）</text>
    <text x="1004" y="451" font-size="10" fill="#b91c1c">多为单公司自述</text>

    <rect x="990" y="476" width="150" height="144" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="1004" y="499" font-size="12" font-weight="700" fill="#0f172a">中国大厂方案</text>
    <text x="1004" y="521" font-size="10" fill="#64748b">阿里 PolarDB/Context0</text>
    <text x="1004" y="537" font-size="10" fill="#64748b">蚂蚁 TuGraph</text>
    <text x="1004" y="553" font-size="10" fill="#64748b">腾讯 DataBuddy/Topbase</text>
    <text x="1004" y="569" font-size="10" fill="#64748b">华为 DataArts</text>
    <text x="1004" y="585" font-size="10" fill="#64748b">京东 Oxygen/海博</text>
    <text x="1004" y="603" font-size="10" fill="#64748b">中泰证券（金融）</text>
    <text x="1004" y="617" font-size="9" fill="#b91c1c">产品存在≠采用</text>
  </g>
</svg>
